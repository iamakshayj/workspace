[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "verifiable-evidence-core"
version = "0.1.0"
description = "Open core for normalized compliance evidence, lineage, versioned controls, and cryptographically verifiable evidence packs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Akshay Jagadeesh" }]
dependencies = ["cryptography>=42,<51"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
evidence-core = "evidence_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
